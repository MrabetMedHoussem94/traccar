# Run with (from the repo root):
#   POSTGRES_PASSWORD=change-me docker compose -f docker/compose/traccar-local.yaml up -d --build

services:

  database:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: traccar
      POSTGRES_USER: traccar
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - traccar-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U traccar -d traccar" ]
      interval: 5s
      timeout: 5s
      retries: 10

  traccar:
    build:
      context: ../..
      dockerfile: docker/Dockerfile.local
    restart: unless-stopped
    depends_on:
      database:
        condition: service_healthy
    environment:
      CONFIG_USE_ENVIRONMENT_VARIABLES: "true"
      DATABASE_DRIVER: org.postgresql.Driver
      DATABASE_URL: jdbc:postgresql://database:5432/traccar
      DATABASE_USER: traccar
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "8082:8082"
      - "5000-5500:5000-5500"
    volumes:
      - traccar-logs:/opt/traccar/logs

volumes:
  traccar-db:
  traccar-logs:
